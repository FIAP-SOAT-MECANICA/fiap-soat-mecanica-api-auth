name: Deploy AWS

on:
  push:
    branches: [main, homolog]

permissions:
  contents: read

jobs:
  deploy:
    name: Implantar Lambda e API Gateway
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
      TF_STATE_KEY: auth/${{ github.ref_name == 'main' && 'production' || 'homologation' }}/terraform.tfstate
      AWS_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_aws_region: ${{ vars.TF_STATE_REGION }}
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
      TF_VAR_db_secret_arn: ${{ secrets.DB_SECRET_ARN }}
      TF_VAR_jwt_secret_arn: ${{ secrets.JWT_SECRET_ARN }}
      TF_VAR_jwt_audience: ${{ vars.JWT_AUDIENCE }}
      TF_VAR_private_subnet_ids: ${{ vars.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_lambda_security_group_ids: ${{ vars.LAMBDA_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_kms_key_arns: ${{ vars.KMS_KEY_ARNS_JSON }}
      TF_VAR_lambda_execution_role_arn: ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testar e gerar JAR da Lambda
        run: mvn --batch-mode verify

      - name: Configurar credenciais temporarias AWS Academy
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Inicializar state remoto
        run: >-
          terraform -chdir=infra init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.TF_STATE_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Planejar infraestrutura
        run: terraform -chdir=infra plan -out=tfplan

      - name: Aplicar infraestrutura
        run: terraform -chdir=infra apply -auto-approve tfplan
